<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Barrel Beat</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 165, 0, 0.16), transparent 35%),
          linear-gradient(180deg, #1b120a 0%, #120d08 100%);
        font-family: Arial, sans-serif;
      }
      body {
        overflow: hidden;
      }
      #game-root {
        width: 100vw;
        height: 100vh;
      }
      .hud {
        position: fixed;
        left: 12px;
        bottom: 88px;
        z-index: 10;
        font-size: 12px;
        color: #f3e9dc;
        opacity: 0.85;
        pointer-events: none;
      }
      .controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        padding: 0 16px calc(env(safe-area-inset-bottom) + 4px);
        gap: 16px;
      }
      .control-btn {
        width: 88px;
        height: 56px;
        border: 1px solid rgba(255, 179, 71, 0.45);
        border-radius: 16px;
        background: rgba(255, 179, 71, 0.14);
        color: #ffcf7d;
        font-size: 24px;
        font-weight: 700;
        backdrop-filter: blur(6px);
      }
      .control-btn:active {
        transform: scale(0.98);
      }
      canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div class="hud">Barrel Beat • alpha foundation</div>

    <div class="controls">
      <button id="control-left" class="control-btn" aria-label="Move left">◀</button>
      <button id="control-right" class="control-btn" aria-label="Move right">▶</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <script type="module" src="./build/main.js"></script>
  </body>
</html>
