<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Barrel Beat</title>
    <meta name="theme-color" content="#120d08" />
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(255, 165, 0, 0.12), transparent 35%),
          linear-gradient(180deg, #1b120a 0%, #120d08 100%);
        font-family: Arial, sans-serif;
      }
      body { overflow: hidden; }

      #app-shell {
        position: relative;
        width: min(100vw, 430px);
        height: 100dvh;
        margin: 0 auto;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(255, 179, 71, 0.08), transparent 40%),
          linear-gradient(180deg, #1b120a 0%, #120d08 100%);
        border-left: 1px solid rgba(255, 179, 71, 0.08);
        border-right: 1px solid rgba(255, 179, 71, 0.08);
      }

      #game-root {
        width: 100%;
        height: 100%;
      }

      .hud {
        position: absolute;
        left: 12px;
        bottom: calc(86px + env(safe-area-inset-bottom));
        z-index: 10;
        font-size: 12px;
        color: #f3e9dc;
        opacity: 0.68;
        pointer-events: none;
      }

      .touch-layer {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }

      .move-zone {
        position: absolute;
        bottom: calc(12px + env(safe-area-inset-bottom));
        width: 34%;
        height: 84px;
        border-radius: 18px;
        pointer-events: auto;
        background: rgba(255, 179, 71, 0.06);
        border: 1px solid rgba(255, 205, 140, 0.10);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 220, 168, 0.82);
        font-size: 28px;
        font-weight: 700;
        user-select: none;
      }

      .move-zone:active {
        background: rgba(255, 179, 71, 0.12);
      }

      #move-left {
        left: 10px;
      }

      #move-right {
        right: 10px;
      }

      .climb-btn {
        position: absolute;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        min-width: 92px;
        height: 56px;
        padding: 0 18px;
        border-radius: 18px;
        border: 1px solid rgba(125, 211, 252, 0.20);
        background: rgba(56, 189, 248, 0.12);
        color: #dff5ff;
        font-size: 18px;
        font-weight: 700;
        pointer-events: auto;
        backdrop-filter: blur(6px);
        display: none;
      }

      .climb-btn.visible {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(7, 5, 3, 0.68);
        backdrop-filter: blur(8px);
      }

      .overlay.hidden { display: none; }

      .card {
        width: min(100%, 360px);
        border: 1px solid rgba(255, 179, 71, 0.22);
        border-radius: 24px;
        padding: 24px 20px;
        background:
          linear-gradient(180deg, rgba(33, 21, 10, 0.92), rgba(18, 13, 8, 0.96));
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.38);
        text-align: center;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ffcf7d;
        opacity: 0.9;
        margin-bottom: 10px;
      }

      .title {
        margin: 0;
        font-size: 40px;
        line-height: 0.95;
        color: #ffb347;
      }

      .subtitle {
        margin: 14px 0 0;
        color: #f3e9dc;
        font-size: 15px;
        line-height: 1.45;
        opacity: 0.92;
      }

      .meta {
        margin-top: 16px;
        font-size: 13px;
        color: #d8c3aa;
        opacity: 0.9;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }

      .primary-btn,
      .secondary-btn {
        width: 100%;
        min-height: 52px;
        border-radius: 16px;
        font-size: 17px;
        font-weight: 700;
        border: none;
      }

      .primary-btn {
        background: linear-gradient(180deg, #ffb347, #e18b17);
        color: #1c1208;
      }

      .secondary-btn {
        background: rgba(255, 179, 71, 0.10);
        color: #ffcf7d;
        border: 1px solid rgba(255, 179, 71, 0.22);
      }

      .stats {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 18px;
      }

      .stat {
        flex: 1;
        border-radius: 14px;
        padding: 12px;
        background: rgba(255, 179, 71, 0.07);
        border: 1px solid rgba(255, 179, 71, 0.14);
      }

      .stat-label {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #d8c3aa;
      }

      .stat-value {
        margin-top: 6px;
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
      }

      .tap-note {
        margin-top: 12px;
        font-size: 12px;
        color: #d8c3aa;
        opacity: 0.85;
      }

      canvas {
        display: block;
        margin: 0 auto;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="game-root"></div>
      <div class="hud">Barrel Beat • touch zones</div>

      <div class="touch-layer">
        <div id="move-left" class="move-zone" aria-label="Move left">◀</div>
        <div id="move-right" class="move-zone" aria-label="Move right">▶</div>
        <button id="climb-action" class="climb-btn" aria-label="Climb">טפס</button>
      </div>

      <div id="start-overlay" class="overlay">
        <div class="card">
          <div class="eyebrow">Arcade climb</div>
          <h1 class="title">BARREL<br />BEAT</h1>
          <p class="subtitle">
            Climb the tower, dodge the barrels, and reach the beacon at the top.
          </p>
          <div class="meta">Touch left/right zones • climb button appears near ladders</div>
          <div class="actions">
            <button id="start-button" class="primary-btn">Play</button>
          </div>
        </div>
      </div>

      <div id="gameover-overlay" class="overlay hidden">
        <div id="gameover-card" class="card">
          <div class="eyebrow">Run complete</div>
          <h2 class="title" style="font-size: 34px;">GAME OVER</h2>

          <div class="stats">
            <div class="stat">
              <div class="stat-label">Score</div>
              <div id="final-score" class="stat-value">0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Best</div>
              <div id="best-score" class="stat-value">0</div>
            </div>
          </div>

          <div class="actions">
            <button id="restart-button" class="primary-btn">Play Again</button>
            <button id="share-button" class="secondary-btn">Share Score</button>
          </div>

          <div class="tap-note">Tap this card to restart</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
    <script type="module" src="./build/main.js"></script>
  </body>
</html>
